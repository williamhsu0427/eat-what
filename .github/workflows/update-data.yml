name: 更新店家資料
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'   # 每週一台灣時間凌晨 3 點
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium
      - run: curl -sSfL --retry 3 -o taiwan.osm.pbf https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
      - run: python tools/build_data.py taiwan.osm.pbf data
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "更新店家資料" && git push)
