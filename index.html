<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e65100">
<title>等一下吃什麼</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f4f1;--card:#fff;--text:#22201d;--sub:#6b655e;--line:#e7e2db;--main:#e65100;--cn:#c62828;--it:#2e7d32;--th:#6a1b9a}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#1f1c19;--text:#eeeae5;--sub:#a59d94;--line:#332e29;--main:#ff8a3d;--cn:#ef6a6a;--it:#5cbf63;--th:#c38be0}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#e65100;color:#fff}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
.tabs{display:flex;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.tab{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:9px 4px;font-size:15px;font-weight:600}
.tab small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.tab.on{color:#fff;border-color:transparent}
.tab.on small{color:rgba(255,255,255,.85)}
.tab[data-k=cn].on{background:var(--cn)}.tab[data-k=it].on{background:var(--it)}.tab[data-k=th].on{background:var(--th)}
.bar{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;color:var(--sub)}
.bar select{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 8px;font-size:13px}
#status.err{color:var(--cn)}
#list{flex:1;overflow:auto;padding:0 12px calc(16px + env(safe-area-inset-bottom))}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.top{display:flex;align-items:baseline;gap:8px}
.top b{flex:1;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist{font-size:13px;color:var(--sub);white-space:nowrap}
.meta{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.45}
.btns{display:flex;gap:6px;margin-top:10px}
.btns a{flex:1;white-space:nowrap;text-align:center;text-decoration:none;font-size:14px;border-radius:10px;padding:9px 2px;border:1px solid var(--line);color:var(--text);background:var(--bg)}
.btns a.nav{background:var(--main);border-color:var(--main);color:#fff;font-weight:600;flex:1.3}
.star{display:inline-block;font-size:13px;font-weight:700;border-radius:8px;padding:2px 7px;background:#fff3e0;color:#e65100;white-space:nowrap}
@media (prefers-color-scheme:dark){.star{background:#3a2a1a;color:#ffb27a}}
.star.no{background:var(--bg);color:var(--sub);font-weight:400}
.ai{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--sub);margin-left:4px}
.sec{font-size:13px;color:var(--sub);margin:16px 2px 0}
.tip{background:var(--card);border:1px dashed var(--main);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;line-height:1.6}
.tip button{border:0;background:var(--main);color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
label.tg{display:flex;align-items:center;gap:4px}
dialog{border:0;border-radius:16px;padding:18px;max-width:420px;width:calc(100% - 32px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{font-size:17px;margin:0 0 8px}
dialog p,dialog li{font-size:14px;line-height:1.6;color:var(--sub)}
dialog ol{padding-left:20px;margin:6px 0}
dialog input{width:100%;font-size:15px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin:8px 0}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
dialog .row button{border:0;border-radius:10px;padding:9px 14px;font-size:15px;background:var(--bg);color:var(--text)}
dialog .row button.pri{background:var(--main);color:#fff}
dialog a{color:var(--main)}
.draw{display:block;width:calc(100% - 24px);margin:8px 12px 0;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#e65100,#f9a825)}
.price{color:var(--text)}
#res .cat{display:inline-block;color:#fff;border-radius:8px;padding:2px 10px;font-size:14px;font-weight:600}
#res .nm{font-size:22px;font-weight:800;margin:10px 0 4px;line-height:1.3}
#res .meta{font-size:14px}
#res.spin .nm{opacity:.55}
.empty{text-align:center;color:var(--sub);padding:40px 16px;line-height:1.7}
footer{font-size:11px;color:var(--sub);text-align:center;padding:10px 0 4px}
</style>
</head>
<body>
<header>
  <h1>🍜 等一下吃什麼</h1>
  <button id="reload">重新定位</button>
  <button id="gear" aria-label="設定">⚙︎</button>
</header>
<div class="tabs">
  <button class="tab on" data-k="cn">中式<small id="n-cn">–</small></button>
  <button class="tab" data-k="it">義式<small id="n-it">–</small></button>
  <button class="tab" data-k="th">泰式<small id="n-th">–</small></button>
</div>
<div class="bar">
  <span id="status">定位中…</span>
  <label class="tg"><input type="checkbox" id="only4" checked>只看 4 分以上</label>
  <select id="radius">
    <option value="1000">1 公里</option>
    <option value="2000">2 公里</option>
    <option value="3000" selected>3 公里</option>
    <option value="5000">5 公里</option>
  </select>
</div>
<button class="draw" id="drawBtn">🎲 不知道吃什麼？隨機抽一家</button>
<div id="list"></div>
<dialog id="drawDlg">
  <div id="res"></div>
  <div class="row"><button id="drawClose">關閉</button><button id="drawAgain">再抽一次</button><a class="pri" id="drawNav" target="_blank" rel="noopener" style="text-decoration:none;border-radius:10px;padding:9px 14px;font-size:15px;background:var(--main);color:#fff">導航過去</a></div>
</dialog>
<dialog id="dlg">
  <h2>Google 地圖設定</h2>
  <p>店家、評分、價位都是請 Google 的 Gemini AI 查 Google 地圖，跟部落格產生器同一招。需要一把<b>免費</b>的 Gemini 金鑰，不用綁卡：</p>
  <ol>
    <li>打開 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>，用 Google 帳號登入</li>
    <li>按「建立 API 金鑰」，複製起來</li>
    <li>貼到下面，按儲存</li>
  </ol>
  <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="貼上 Gemini API 金鑰">
  <p style="font-size:12px">金鑰只存在這支手機裡。免費額度每天可以查好幾百次，個人用不會超過；萬一超過只會暫時查不到，不會收費。</p>
  <div class="row"><button id="dlgClose">取消</button><button class="pri" id="dlgSave">儲存</button></div>
</dialog>
<script>
// 店家資料：請 Gemini 用 Google 地圖（不行就用 Google 搜尋）查附近餐廳。只需要免費的 Gemini 金鑰，不用綁卡。
const MODELS = ['gemini-2.5-flash', 'gemini-flash-latest', 'gemini-2.5-flash-lite'];
const CAT_NAME = { cn: '中式', it: '義式', th: '泰式' };
const CAT_Q = { cn: '中式餐廳（含台菜、港式、川菜、麵館、小吃、火鍋等中華料理）', it: '義式餐廳（義大利麵、披薩、燉飯等義大利料理）', th: '泰式餐廳（泰國料理）' };
const CAT_COLOR = { cn: 'var(--cn)', it: 'var(--it)', th: 'var(--th)' };
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
let here = null, area = '', cur = store.get('tab') || 'cn', apiKey = store.get('gkey') || '';
let res = {}; // 每類：{ state: 'loading'|'done'|'err', items: [], err }
$('only4').checked = store.get('only4') !== '0';
if (store.get('rad')) $('radius').value = store.get('rad');

function dist(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function setStatus(s, err) { $('status').textContent = s; $('status').className = err ? 'err' : ''; }
function radText() { const r = +$('radius').value; return r >= 1000 ? r / 1000 + ' 公里' : r + ' 公尺'; }
function distText(d) {
  if (d == null) return '';
  if (d < 1000) return Math.round(d) + ' 公尺・走路約 ' + Math.max(1, Math.round(d / 75)) + ' 分';
  return (d / 1000).toFixed(1) + ' 公里' + (d <= 1500 ? '・走路約 ' + Math.round(d / 75) + ' 分' : '・騎車約 ' + Math.max(3, Math.round(d / 300)) + ' 分');
}
function mapsQuery(x) { return encodeURIComponent(x.name + (x.address ? ' ' + x.address : '')); }
function navUrl(x) {
  return 'https://www.google.com/maps/dir/?api=1&travelmode=' + (x.d != null && x.d <= 1500 ? 'walking' : 'driving') +
    '&destination=' + mapsQuery(x) + (x.placeId ? '&destination_place_id=' + encodeURIComponent(x.placeId) : '');
}
function card(x) {
  const g = 'https://www.google.com/maps/search/?api=1&query=' + mapsQuery(x) + (x.placeId ? '&query_place_id=' + encodeURIComponent(x.placeId) : '');
  const tag = x.name.replace(/[\s\p{P}\p{S}]/gu, '');
  const ig = 'https://www.instagram.com/explore/tags/' + encodeURIComponent(tag) + '/';
  const th = 'https://www.threads.net/search?q=' + encodeURIComponent(x.name);
  const star = x.r != null ? `<span class="star">★ ${x.r.toFixed(1)}${x.n ? `・${x.n} 則` : ''}</span>` : '<span class="star no">查無評分</span>';
  const meta = [distText(x.d), x.p && '💰 ' + x.p, x.type, x.address].filter(Boolean).map(esc).join('<br>');
  return `<div class="item">
    <div class="top"><b>${esc(x.name)}</b>${star}</div>
    ${meta ? `<div class="meta">${meta}</div>` : ''}
    <div class="btns">
      <a class="nav" href="${navUrl(x)}" target="_blank" rel="noopener">導航</a>
      <a href="${g}" target="_blank" rel="noopener">評論</a>
      <a href="${ig}" target="_blank" rel="noopener">IG</a>
      <a href="${th}" target="_blank" rel="noopener">Threads</a>
    </div></div>`;
}
function visible(k) {
  const items = res[k]?.items || [];
  return $('only4').checked ? items.filter(x => x.r >= 4) : items;
}
function render() {
  for (const k of ['cn', 'it', 'th']) {
    const R = res[k];
    $('n-' + k).textContent = R?.state === 'done' ? visible(k).length + ' 家' : R?.state === 'loading' ? '查詢中' : '–';
  }
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.k === cur));
  const R = res[cur];
  let html = '';
  if (!apiKey) html = '<div class="tip">要先設定一把<b>免費</b>的 Gemini 金鑰（不用綁卡），App 才能查 Google 地圖上的店家。<br><button onclick="openDlg()">設定金鑰</button></div>';
  else if (!here) html = '<div class="empty">定位中…</div>';
  else if (!R || R.state === 'loading') html = `<div class="tip">正在查 Google 地圖上 ${radText()} 內的${CAT_NAME[cur]}餐廳，約 10～30 秒…</div>`;
  else if (R.state === 'err') html = `<div class="tip">查詢失敗：${esc(R.err)}<br><button onclick="fetchCat(cur, true)">再查一次</button></div>`;
  else {
    const v = visible(cur);
    html = v.length ? v.map(card).join('') : `<div class="empty">${radText()}內沒有查到${$('only4').checked ? ' 4 分以上的' : ''}${CAT_NAME[cur]}餐廳<br>可以把範圍調大${$('only4').checked ? '或取消「只看 4 分以上」' : ''}試試</div>`;
    html += `<div class="empty" style="padding:12px"><button class="chip" onclick="fetchCat(cur, true)" style="border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px">重新查詢</button></div>`;
  }
  $('list').innerHTML = html + '<footer>店家資料由 Gemini 查詢 Google 地圖，僅供參考</footer>';
}

let mapsOff = false;
async function gemini(prompt) {
  const ll = { latitude: here.lat, longitude: here.lon };
  // 先試 Google 地圖查詢，帳號不支援就改用 Google 搜尋
  const bodies = [
    { contents: [{ role: 'user', parts: [{ text: prompt }] }], tools: [{ googleMaps: {} }], toolConfig: { retrievalConfig: { latLng: ll, languageCode: 'zh-TW' } } },
    { contents: [{ role: 'user', parts: [{ text: prompt }] }], tools: [{ google_search: {} }] }
  ];
  let last = '';
  for (const body of bodies) for (const m of MODELS) {
    if (body.tools[0].googleMaps && mapsOff) break;
    let r;
    try {
      r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
        method: 'POST', headers: { 'x-goog-api-key': apiKey, 'content-type': 'application/json' }, body: JSON.stringify(body)
      });
    } catch (e) { last = '網路連不上，請確認手機有網路'; continue; }
    if (r.ok) {
      const j = await r.json(), c = j.candidates?.[0] || {};
      const text = (c.content?.parts || []).filter(p => p.text && !p.thought).map(p => p.text).join('');
      const places = (c.groundingMetadata?.groundingChunks || []).map(x => x.maps).filter(Boolean);
      if (text.includes('{')) return { text, places };
      last = 'AI 沒有回傳店家資料'; continue;
    }
    let msg = 'HTTP ' + r.status;
    try { msg = (await r.json()).error?.message || msg; } catch (e) {}
    if (r.status === 401 || r.status === 403 || /API key not valid/i.test(msg)) throw new Error('金鑰無效，請按右上角 ⚙︎ 重新設定');
    if (body.tools[0].googleMaps && r.status === 400) { mapsOff = true; break; } // 這把金鑰不支援 Google 地圖查詢，之後直接用 Google 搜尋
    last = r.status === 429 ? '今天的免費額度用完了，明天會自動恢復' : msg;
  }
  throw new Error(last);
}

async function fetchCat(k, force) {
  if (!apiKey || !here || res[k]?.state === 'loading' || (res[k]?.state === 'done' && !force)) return;
  const rad = +$('radius').value;
  const ck = 'g1:' + k + ':' + here.lat.toFixed(3) + ',' + here.lon.toFixed(3) + ':' + rad;
  if (!force) {
    try {
      const c = JSON.parse(store.get(ck));
      if (c && Date.now() - c.t < 6 * 3600e3) { res[k] = { state: 'done', items: c.items }; render(); return; }
    } catch (e) {}
  }
  res[k] = { state: 'loading' }; render();
  const prompt = `我現在在台灣，位置是緯度 ${here.lat.toFixed(5)}、經度 ${here.lon.toFixed(5)}${area ? `（${area}附近）` : ''}。
請查 Google 地圖，列出離我 ${rad} 公尺以內、目前仍有營業的${CAT_Q[k]}，最多 15 家，評分高的優先。

只回傳一個 JSON 物件，不要其他文字、不要程式碼框：
{"places":[{"name":"Google 地圖上的店名","address":"完整地址","lat":25.04,"lon":121.54,"rating":4.3,"reviews":512,"price":"$200-400","type":"例如 牛肉麵、港式飲茶"}]}
規則：只列真的存在、在範圍內的店；rating 和 reviews 用 Google 地圖上的數字；price 是每人平均消費（新台幣），查不到填空字串；lat、lon 查不到填 null；絕對不可以編造。`;
  try {
    const { text, places } = await gemini(prompt);
    const j = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
    const seen = new Set();
    const items = (j.places || []).filter(e => e && e.name && !seen.has(e.name) && seen.add(e.name)).map(e => {
      const lat = parseFloat(e.lat), lon = parseFloat(e.lon), r = parseFloat(e.rating);
      let d = isFinite(lat) && isFinite(lon) ? dist(here, { lat, lon }) : null;
      if (d != null && d > rad * 3) d = null; // 座標明顯不對就不顯示距離
      const pm = places.find(p => p.title && (p.title === e.name || p.title.includes(e.name) || e.name.includes(p.title)));
      const pr = String(e.price ?? '').trim();
      return {
        name: String(e.name), address: String(e.address || ''), d, r: r > 0 && r <= 5 ? r : null, n: parseInt(e.reviews) || null,
        p: /\d/.test(pr) && pr.length < 30 ? '每人約 ' + pr.replace(/^每人(約)?/, '') : '', type: String(e.type || '').slice(0, 30),
        placeId: pm?.placeId ? String(pm.placeId).replace(/^places\//, '') : ''
      };
    }).sort((a, b) => (a.d ?? 9e9) - (b.d ?? 9e9) || (b.r ?? 0) - (a.r ?? 0));
    res[k] = { state: 'done', items };
    store.set(ck, JSON.stringify({ t: Date.now(), items }));
  } catch (e) {
    res[k] = { state: 'err', err: e.message || '查詢失敗' };
  }
  render();
}

// 隨機抽：先隨機選料理種類，再從該類（有勾 4 分以上就只抽 4 分以上）抽一家
async function poolFor(k) {
  fetchCat(k);
  for (let i = 0; i < 120 && res[k]?.state === 'loading'; i++) await new Promise(r => setTimeout(r, 500));
  return visible(k);
}
async function draw() {
  if (!apiKey) return openDlg();
  if (!here) { setStatus('還沒定位完成，請稍等或按「重新定位」', true); return; }
  const box = $('res');
  if (!$('drawDlg').open) $('drawDlg').showModal();
  box.className = 'spin'; $('drawNav').style.visibility = 'hidden'; $('drawAgain').disabled = true;
  const all = ['cn', 'it', 'th'].flatMap(k => (res[k]?.items || []).map(x => [k, x]));
  const t = setInterval(() => {
    const [k, x] = all.length ? all[Math.random() * all.length | 0] : [['cn', 'it', 'th'][Math.random() * 3 | 0], null];
    box.innerHTML = `<span class="cat" style="background:${CAT_COLOR[k]}">${CAT_NAME[k]}</span><div class="nm">${x ? esc(x.name) : '抽籤中…'}</div><div class="meta">抽籤中…（第一次抽會先查店家，要等一下）</div>`;
  }, 90);
  let k, x;
  for (k of ['cn', 'it', 'th'].sort(() => Math.random() - .5)) { const pool = await poolFor(k); if (pool.length) { x = pool[Math.random() * pool.length | 0]; break; } }
  await new Promise(r => setTimeout(r, 900));
  clearInterval(t); box.className = ''; $('drawAgain').disabled = false;
  if (!x) { box.innerHTML = '<div class="nm">附近沒有可以抽的店</div><div class="meta">把範圍調大或取消「只看 4 分以上」再試試</div>'; return; }
  box.innerHTML = `<span class="cat" style="background:${CAT_COLOR[k]}">${CAT_NAME[k]}</span><div class="nm">${esc(x.name)}</div>
    <div class="meta">${[x.r != null && `★ ${x.r.toFixed(1)}${x.n ? `（${x.n} 則評論）` : ''}`, x.p && '💰 ' + x.p, distText(x.d), x.address].filter(Boolean).map(esc).join('<br>')}</div>`;
  $('drawNav').href = navUrl(x); $('drawNav').style.visibility = '';
}

function openDlg() { $('key').value = apiKey; $('dlg').showModal(); }

async function findArea() {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=16&accept-language=zh-TW&lat=${here.lat}&lon=${here.lon}`);
    const a = (await r.json()).address || {};
    area = [a.city || a.county, a.town || a.suburb || a.city_district, a.road].filter(Boolean).join('');
  } catch (e) { area = ''; }
}
function located(p) {
  here = { lat: p.coords.latitude, lon: p.coords.longitude };
  setStatus('已定位，查詢範圍 ' + radText());
  res = {}; render();
  findArea().finally(() => fetchCat(cur));
}
function locate() {
  if (!navigator.geolocation) { setStatus('這支手機不支援定位', true); return; }
  setStatus('定位中…');
  navigator.geolocation.getCurrentPosition(located, e => {
    if (e.code === 1) return setStatus('請允許「位置」權限（網址列左邊圖示 → 權限 → 位置），再按「重新定位」', true);
    // 高精度定位逾時（室內常發生）就改用網路定位再試一次
    navigator.geolocation.getCurrentPosition(located, () => setStatus('定位失敗，請確認手機有開「定位」，再按「重新定位」', true),
      { enableHighAccuracy: false, timeout: 20000, maximumAge: 300000 });
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => { cur = b.dataset.k; store.set('tab', cur); render(); fetchCat(cur); });
$('reload').onclick = locate;
$('gear').onclick = openDlg;
$('drawBtn').onclick = draw;
$('drawAgain').onclick = draw;
$('drawClose').onclick = () => $('drawDlg').close();
$('dlgClose').onclick = () => $('dlg').close();
$('dlgSave').onclick = () => { apiKey = $('key').value.trim(); store.set('gkey', apiKey || null); $('dlg').close(); res = {}; render(); fetchCat(cur); };
$('only4').onchange = () => { store.set('only4', $('only4').checked ? '1' : '0'); render(); };
$('radius').onchange = () => { store.set('rad', $('radius').value); res = {}; render(); here ? fetchCat(cur) : locate(); };
render(); locate();
if (!apiKey) setTimeout(openDlg, 600);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
