<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e65100">
<title>等一下吃什麼</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{--bg:#f4f2ef;--card:#fff;--text:#22201d;--sub:#6b655e;--line:#e7e2db;--main:#e65100;--soft:#fff3e0;--softt:#b34700;--ok:#2e7d32;--no:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#1f1c19;--text:#eeeae5;--sub:#a59d94;--line:#332e29;--main:#ff8a3d;--soft:#3a2a1a;--softt:#ffb27a;--ok:#66bb6a;--no:#ef6a6a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}
button{font-family:inherit}
header{background:#e65100;color:#fff;padding:10px 12px 10px;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1}
header .loc{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:7px 11px;font-size:14px}
.search{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:0 10px;margin-top:9px}
.search input{flex:1;border:0;outline:0;font-size:15px;padding:10px 0;background:transparent;color:#22201d;min-width:0}
.search button{border:0;background:none;color:#999;font-size:18px;padding:0 2px}
.chips{display:flex;gap:6px;padding:9px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip small{color:var(--sub);margin-left:3px}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.chip.on small{color:rgba(255,255,255,.85)}
.bar{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;color:var(--sub);background:var(--card);border-bottom:1px solid var(--line)}
.bar #status{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status.err{color:var(--no)}
.tg{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:5px 10px;font-size:13px;white-space:nowrap}
.tg.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bar select{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:5px 6px;font-size:13px}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;padding:0 12px 16px;display:none}
.view.on{display:block}
#v-map{padding:0}
#map{position:absolute;inset:0}
.draw{display:block;width:100%;margin:10px 0 0;border:0;border-radius:12px;padding:11px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(90deg,#e65100,#f9a825)}
.sec{font-size:13px;color:var(--sub);margin:16px 2px 0;font-weight:600}
.sec small{font-weight:400}
.item{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;cursor:pointer}
.item.pick{border-color:var(--main)}
.thumb{flex:0 0 64px;height:64px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--soft)}
.info{flex:1;min-width:0}
.top{display:flex;align-items:baseline;gap:6px}
.top b{flex:1;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist{font-size:12px;color:var(--sub);white-space:nowrap}
.line2{font-size:13px;color:var(--sub);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.line3{font-size:13px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--softt)}
.open{color:var(--ok);font-weight:600}.closed{color:var(--no);font-weight:600}
.mine{color:#f9a825;font-weight:700}
.heart{flex:0 0 auto;border:0;background:none;font-size:22px;padding:0 2px;align-self:center;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:28px 16px;line-height:1.7;font-size:14px}
.empty button{border:0;background:var(--main);color:#fff;border-radius:8px;padding:7px 12px;font-size:14px;margin-top:6px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px;font-size:14px}
.seg button.on{background:var(--main);border-color:var(--main);color:#fff}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0 7px;font-size:12px}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--main);font-weight:700}
dialog{border:0;padding:0;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#sheet{margin:auto auto 0;width:100%;max-width:560px;max-height:88vh;border-radius:18px 18px 0 0;overflow:auto}
#sheet .sb{padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh-top{display:flex;gap:12px;align-items:center}
.sh-top .thumb{flex-basis:56px;height:56px;font-size:28px}
.sh-top h2{font-size:20px;margin:0;line-height:1.3}
.sh-x{margin-left:auto;align-self:flex-start;border:0;background:var(--bg);color:var(--text);border-radius:50%;width:32px;height:32px;font-size:16px}
.rows{margin-top:12px;font-size:14px;line-height:1.6}
.rows div{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.rows div i{font-style:normal;flex:0 0 22px;text-align:center}
.rows a{color:var(--main)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grid a,.grid button{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:10px 4px;font-size:13px}
.grid a span,.grid button span{font-size:20px}
.grid .nav{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
.my{margin-top:16px;padding:12px;border-radius:12px;background:var(--bg)}
.my h3{margin:0 0 8px;font-size:15px}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:28px;padding:0;color:var(--line)}
.stars button.on{color:#f9a825}
.my textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;font-family:inherit;background:var(--card);color:var(--text);min-height:60px}
#draw-dlg{border-radius:16px;padding:18px;max-width:420px;width:calc(100% - 32px)}
#res .cat{display:inline-block;color:#fff;background:var(--main);border-radius:8px;padding:2px 10px;font-size:14px;font-weight:600}
#res .nm{font-size:22px;font-weight:800;margin:10px 0 4px;line-height:1.3}
#res.spin .nm{opacity:.5}
#res .meta{font-size:14px;color:var(--sub)}
#res .row{display:flex;gap:8px;margin-top:14px}
#res .row button,#res .row a{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px 6px;font-size:16px;font-weight:700}
#res .row button{background:var(--bg);color:var(--text)}
#res .row a{background:var(--main);color:#fff}
.pin{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin.star{border-color:#e65100;background:#fff3e0;width:30px;height:30px}
.me{width:16px;height:16px;border-radius:50%;background:#1e88e5;border:3px solid #fff;box-shadow:0 0 0 2px rgba(30,136,229,.4)}
.leaflet-popup-content{font-size:14px;margin:10px 12px}
.leaflet-popup-content button{margin-top:6px;border:0;background:#e65100;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
footer{font-size:11px;color:var(--sub);text-align:center;padding:14px 0 4px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>🍜 等一下吃什麼</h1><button class="loc" id="reload">📍 重新定位</button></div>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="搜尋店名或菜色，例如牛肉麵" autocomplete="off"><button id="qx" hidden>✕</button></div>
</header>
<div class="chips" id="chips"></div>
<div class="bar">
  <span id="status">定位中…</span>
  <button class="tg" id="openNow">營業中</button>
  <select id="radius">
    <option value="500">500 公尺</option>
    <option value="1000">1 公里</option>
    <option value="2000">2 公里</option>
    <option value="3000">3 公里</option>
    <option value="5000" selected>5 公里</option>
  </select>
</div>
<main>
  <div class="view on" id="v-list"></div>
  <div class="view" id="v-map"><div id="map"></div></div>
  <div class="view" id="v-fav"></div>
</main>
<nav>
  <button class="on" data-v="list"><span>🍽️</span>附近</button>
  <button data-v="map"><span>🗺️</span>地圖</button>
  <button data-v="fav"><span>❤️</span>收藏</button>
</nav>

<dialog id="sheet"></dialog>
<dialog id="draw-dlg"><div id="res"></div></dialog>

<script src="leaflet.js"></script>
<script>

};

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dist(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const x = Math.sin((b.lat - a.lat) * r / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin((b.lon - a.lon) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function fmt(m) { return m < 1000 ? Math.round(m / 10) * 10 + ' 公尺' : (m / 1000).toFixed(1) + ' 公里'; }
function emoji(s) { return CAT[s.k[0]]?.e || '🍽️'; }

function classify(t, amenity) {
  const c = (t.cuisine || '').toLowerCase(), n = t.name || '', ks = [];
  for (const C of CATS) {
    // 店名排除字只擋「看店名猜」的情況，地圖上標好的料理種類照收
    const byName = (C.nameOnlyIfNoTag ? !c : true) && C.n.test(n) && !(C.x && C.x.test(n));
    if (C.c.test(c) || byName) ks.push(C.k);
  }
  if (amenity === 'ice_cream' && !ks.includes('ds')) ks.push('ds');
  if (/yes|only/.test(t['diet:vegetarian'] || '') || /yes|only/.test(t['diet:vegan'] || '')) ks.includes('veg') || ks.push('veg');
  return ks;
}

// 營業時間：看得懂常見寫法（例如 Mo-Fr 11:00-21:00; Sa,Su off），看不懂就回傳 null
const DAYS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
function parseDays(s) {
  const out = new Set();
  for (const part of s.split(',')) {
    const p = part.trim();
    if (p === 'PH' || p === 'SH') continue;
    const m = p.match(/^(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))?$/);
    if (!m) return null;
    let a = DAYS.indexOf(m[1]); const b = m[2] ? DAYS.indexOf(m[2]) : a;
    for (;;) { out.add(a); if (a === b) break; a = (a + 1) % 7; }
  }
  return [...out];
}
function openState(oh, now = new Date()) {
  if (!oh) return null;
  oh = oh.trim();
  if (oh === '24/7') return true;
  const day = now.getDay(), yd = (day + 6) % 7, min = now.getHours() * 60 + now.getMinutes();
  let today, yday;
  for (const raw of oh.split(';')) {
    const r = raw.trim();
    if (!r) continue;
    const m = r.match(/^((?:Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?(?:\s*,\s*(?:Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?)*)?\s*(.*)$/);
    const days = m[1] ? parseDays(m[1].replace(/\s/g, '')) : [0, 1, 2, 3, 4, 5, 6];
    if (!days) return null;
    if (!days.length) continue;
    const rest = m[2].trim();
    const spans = [];
    if (!/^(off|closed)$/i.test(rest)) {
      for (const t of rest.split(',')) {
        const tm = t.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/);
        if (!tm) return null;
        const s = +tm[1] * 60 + +tm[2]; let e = +tm[3] * 60 + +tm[4];
        if (e <= s) e += 1440;
        spans.push([s, e]);
      }
    }
    if (days.includes(day)) today = spans;
    if (days.includes(yd)) yday = spans;
  }
  return (today || []).some(([s, e]) => min >= s && min < e) || (yday || []).some(([s, e]) => e > 1440 && min + 1440 < e);
}
function ohText(oh) {
  return String(oh).replace(/Mo/g, '一').replace(/Tu/g, '二').replace(/We/g, '三').replace(/Th/g, '四').replace(/Fr/g, '五').replace(/Sa/g, '六').replace(/Su/g, '日')
    .replace(/PH/g, '國定假日').replace(/\boff\b|\bclosed\b/gi, '公休').replace(/24\/7/, '24 小時').replace(/;\s*/g, '；');
}
function openHtml(s) {
  const o = openState(s.h);
  if (o === true) return '<span class="open">營業中</span>';
  if (o === false) return '<span class="closed">休息中</span>';
  return '';
}

async function overpass(q) {
  const ctls = OVERPASS.map(() => new AbortController());
  const tm = setTimeout(() => ctls.forEach(c => c.abort()), 25000);
  try {
    return await Promise.any(OVERPASS.map(async (u, i) => {
      const r = await fetch(u, {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal:ctls[i].signal});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      ctls.forEach((c, j) => j !== i && c.abort());
      return d;
    }));
  } finally { clearTimeout(tm); }
}

// 主要資料：事先從開放地圖整理好、放在 App 旁邊的全台店家（每週自動更新），打開直接讀，不用等資料站
let tileIndex;
function getIndex() {
  if (!tileIndex) tileIndex = fetch('data/index.json').then(r => r.ok ? r.json() : null).catch(() => null);
  return tileIndex;
}
function fromRow(r) {
  const [id, n, lat, lon, am, cu = '', h = '', a = '', tel = '', web = '', veg = 0] = r;
  const t = {name:n, cuisine:cu};
  if (veg) t['diet:vegetarian'] = 'yes';
  const k = classify(t, am);
  return k.length ? {id:'o:' + id, k, n, lat, lon, a, h, tel, web, cu} : null;
}
function bbox(p, R) {
  const dLat = R / 111320, dLon = R / (111320 * Math.cos(p.lat * Math.PI / 180));
  return [p.lat - dLat, p.lon - dLon, p.lat + dLat, p.lon + dLon];
}
async function fetchTiles(p, R) {
  const idx = await getIndex();
  if (!idx) return null;
  dataDate = idx.updated;
  const [s, w, n, e] = bbox(p, R), have = new Set(idx.tiles), keys = [];
  for (let y = Math.floor(s * 10); y <= Math.floor(n * 10); y++)
    for (let x = Math.floor(w * 10); x <= Math.floor(e * 10); x++) if (have.has(y + '_' + x)) keys.push(y + '_' + x);
  if (!keys.length) return null;   // 不在台灣，改問資料站
  const rows = await Promise.all(keys.map(k => fetch('data/' + k + '.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })));
  return rows.flat().map(fromRow).filter(Boolean);
}

// 備用：台灣以外的地方才臨時問開放地圖資料站
async function fetchArea(p, R) {
  const bb = bbox(p, R).map(x => x.toFixed(5)).join(',');
  const d = await overpass(`[out:json][timeout:20];nwr["amenity"~"^(restaurant|fast_food|food_court|cafe|ice_cream)$"]["name"](${bb});out center tags qt;`);
  const v = [];
  for (const e of d.elements) {
    const t = e.tags || {}, k = classify(t, t.amenity);
    const lat = e.lat ?? e.center?.lat, lon = e.lon ?? e.center?.lon;
    if (!k.length || lat == null) continue;
    const addr = [t['addr:city'], t['addr:district'], t['addr:street'], t['addr:housenumber'] && t['addr:housenumber'] + '號'].filter(Boolean).join('');
    v.push({id:'o:' + e.type[0] + e.id, k, n:t.name, lat, lon, a:addr, h:t.opening_hours || '', tel:t.phone || t['contact:phone'] || '', web:t.website || t['contact:website'] || '', cu:t.cuisine || ''});
  }
  return v;
}

let dataDate = '';
async function loadNearby(id) {
  const p = here;

  try { v = await fetchTiles(p, 5000); } catch (e) {}

    if (id !== runId) return;

}

// 篩選：餐種、搜尋字、營業中、距離
function matchQuery(s) {
  if (!query) return true;
  const hay = (s.n + ' ' + (s.a || '') + ' ' + (s.d || '') + ' ' + s.k.map(k => CAT[k]?.name).join(' ') + ' ' + (s.cu || '')).toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function pool(k) {
  const R = +$('radius').value;
  const ok = s => (k === 'all' || s.k.includes(k)) && matchQuery(s) && (!onlyOpen || openState(s.h) === true);
  const withD = arr => arr.filter(ok).map(s => ({...s, m:dist(here, s)})).filter(s => s.m <= R).sort((a, b) => a.m - b.m);
  const picks = onlyOpen ? [] : withD(PICKS);
  const names = new Set(picks.map(p => p.n.slice(0, 3)));
  const near = withD(nearby).filter(s => !names.has(s.n.slice(0, 3)));
  return {picks, near};
}

function card(s, pick) {
  const f = favs[s.id];
  const mine = f?.r ? `<span class="mine">★${f.r}</span>` : '';
  const tags = s.k.slice(0, 2).map(k => CAT[k]?.name).filter(Boolean).join('・');
  return `<div class="item${pick ? ' pick' : ''}" data-id="${esc(s.id)}">
    <div class="thumb">${emoji(s)}</div>
    <div class="info">
      <div class="top"><b>${esc(s.n)}</b><span class="dist">${fmt(s.m)}</span></div>
      <div class="line2">${pick ? '<span class="badge">網友推薦</span>' : ''}${mine}${openHtml(s)}<span>${esc(tags)}</span></div>
      <div class="line3">${esc(pick ? s.d : (s.a || ''))}</div>
    </div>
    <button class="heart" data-heart="${esc(s.id)}" aria-label="收藏">${f?.st ? '❤️' : '🤍'}</button>
  </div>`;
}

let shown = new Map();
function remember(arr) { for (const s of arr) shown.set(s.id, s); return arr; }

  $('chips').innerHTML = list.map(C => `<button class="chip${C.k === cat ? ' on' : ''}" data-k="${C.k}">${C.e} ${C.name}<small id="n-${C.k}"></small></button>`).join('');

function render() {
  if (!here) return;
  const waiting = loading && !nearby.length;
  for (const C of [{k:'all'}].concat(CATS)) {
    const p = pool(C.k);
    $('n-' + C.k).textContent = waiting ? '' : ' ' + (p.picks.length + p.near.length);
  }
  const {picks, near} = pool(cat), name = cat === 'all' ? '' : CAT[cat].name;
  shown = new Map();
  remember(picks); remember(near);
  let h = '<button class="draw" id="draw">🎲 不知道吃什麼？幫我抽一家</button>';
  if (picks.length) h += `<div class="sec">⭐ 網友推薦 <small>景平站一帶</small></div>` + picks.map(s => card(s, true)).join('');
  h += `<div class="sec">📍 附近${name}店家 <small>由近到遠${loading && nearby.length ? '，還在補更遠的店…' : ''}</small></div>`;
  if (waiting) h += '<div class="empty">正在找附近店家…</div>';
  else if (failed) h += '<div class="empty">附近店家暫時抓不到，可能是網路不穩。<br><button onclick="start(true)">再試一次</button></div>';
  else if (!near.length) h += `<div class="empty">找不到符合的店家${onlyOpen ? '（只看營業中：很多小店沒登記營業時間）' : ''}，試試別的餐種、關鍵字或把範圍調大。</div>`;
  else h += near.slice(0, 100).map(s => card(s, false)).join('') + (near.length > 100 ? `<div class="empty">還有 ${near.length - 100} 家，用搜尋或縮小範圍找更快</div>` : '');
  h += '<footer>附近店家來自 OpenStreetMap 開放地圖，免金鑰' + (dataDate ? '（' + dataDate + ' 更新）' : '') + '<br>網友推薦整理自食記與美食平台，出發前建議先確認營業時間</footer>';
  $('v-list').innerHTML = h;

// 地圖模式
let map, layer, meMarker;
function drawMap() {
  if (!here) return;
  if (!map) {
    map = L.map('map', {zoomControl:false}).setView([here.lat, here.lon], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
    layer = L.layerGroup().addTo(map);
    map.on('popupopen', e => {
      const b = e.popup.getElement().querySelector('[data-open]');
      if (b) b.onclick = () => openShop(b.dataset.open);
    });
  }
  setTimeout(() => map.invalidateSize(), 0);
  layer.clearLayers();
  if (meMarker) meMarker.remove();
  meMarker = L.marker([here.lat, here.lon], {icon:L.divIcon({className:'', html:'<div class="me"></div>', iconSize:[16, 16]})}).addTo(map);
  const {picks, near} = pool(cat);
  const add = (s, star) => {
    const C = CAT[s.k[0]];
    L.marker([s.lat, s.lon], {icon:L.divIcon({className:'', html:`<div class="pin${star ? ' star' : ''}">${star ? '⭐' : C?.e || '🍽️'}</div>`, iconSize:star ? [30, 30] : [26, 26]}), zIndexOffset:star ? 1000 : 0})
      .bindPopup(`<b>${esc(s.n)}</b><br>${fmt(s.m)} ${openHtml(s)}<br><button data-open="${esc(s.id)}">看店家</button>`).addTo(layer);
  };
  near.slice(0, 300).forEach(s => add(s, false));
  picks.forEach(s => add(s, true));
}

// 收藏：想去／去過
function saveFavs() { store.set('favs', favs); }
function setFav(s, patch) {
  const base = favs[s.id] || {s:{id:s.id, k:s.k, n:s.n, a:s.a, lat:s.lat, lon:s.lon, h:s.h, d:s.d, src:s.src, tel:s.tel, web:s.web}, st:'', r:0, note:''};
  const f = {...base, ...patch, t:Date.now()};
  if (!f.st && !f.r && !f.note) delete favs[s.id]; else favs[s.id] = f;
  saveFavs();
}
function renderFav() {
  const all = Object.values(favs).map(f => ({...f.s, m:here ? dist(here, f.s) : 0, f}));
  const list = all.filter(x => favTab === 'rated' ? x.f.r : x.f.st === favTab)
    .sort((a, b) => favTab === 'rated' ? b.f.r - a.f.r || a.m - b.m : a.m - b.m);
  remember(all);
  const cnt = t => all.filter(x => t === 'rated' ? x.f.r : x.f.st === t).length;
  let h = `<div class="seg">
    <button data-ft="want" class="${favTab === 'want' ? 'on' : ''}">想去 ${cnt('want')}</button>
    <button data-ft="been" class="${favTab === 'been' ? 'on' : ''}">去過 ${cnt('been')}</button>
    <button data-ft="rated" class="${favTab === 'rated' ? 'on' : ''}">我的評分 ${cnt('rated')}</button></div>`;
  if (!list.length) h += `<div class="empty">${favTab === 'want' ? '還沒有想去的店。<br>在店家清單按 🤍，或打開店家頁按「想去」。' : favTab === 'been' ? '還沒有去過的店。<br>吃完在店家頁按「去過」，順便打分數、寫筆記。' : '還沒有評分。<br>打開店家頁就能幫它打星星。'}</div>`;
  else h += list.map(s => card(s, !!s.src)).join('');
  h += '<footer>收藏只存在這支手機上，不用登入</footer>';
  $('v-fav').innerHTML = h;
  $('v-fav').querySelectorAll('[data-ft]').forEach(b => b.onclick = () => { favTab = b.dataset.ft; renderFav(); });
}

async function share(s) {
  const text = `${s.n}${s.a ? '\n' + s.a : ''}${s.d ? '\n' + s.d : ''}`;
  const url = gmapUrl(s);
  if (navigator.share) { try { await navigator.share({title:s.n, text, url}); return; } catch (e) { if (e.name === 'AbortError') return; } }
  location.href = 'https://line.me/R/share?text=' + encodeURIComponent(text + '\n' + url);
}

// 不要求 GPS 精準定位，用網路定位幾乎是秒回，5 公里範圍夠用了
function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude, lon:p.coords.longitude}), () => res(null), {enableHighAccuracy:false, timeout:8000, maximumAge:300000});
  });
}

async function start(retry) {
  const id = ++runId;
  $('status').classList.remove('err');
  if (!retry || !here) {
    // 先用上次的位置把清單秀出來，定位好了再換
    const last = store.get('lastPos');
    if (last && !here) { here = last; approx = false; $('status').textContent = '定位中，先用上次的位置…'; render(); }
    else $('status').textContent = '定位中…';
    const p = await getPos();
    if (id !== runId) return;
    approx = !p;
    if (p) store.set('lastPos', p);
    here = p || last || JINGPING;
    if (map) map.setView([here.lat, here.lon], 16);
  }
  $('status').textContent = approx ? '抓不到定位，先用' + (store.get('lastPos') ? '上次的位置' : '景平站') : '📍 你目前的位置';
  $('status').classList.toggle('err', approx);
  nearby = []; loading = true; failed = false; render();
  await loadNearby(id);
}

function drawOne() {
  const {picks, near} = pool(cat);
  const res = $('res'), dlg = $('draw-dlg'), label = cat === 'all' ? '全部' : CAT[cat].name;
  if (!picks.length && !near.length) { res.innerHTML = '<p>這個範圍內還沒有店家可以抽。</p><div class="row"><button onclick="this.closest(\'dialog\').close()">好</button></div>'; dlg.showModal(); return; }
  // 網友推薦和想去的店多放幾次，比較容易抽到
  const bag = picks.flatMap(s => [s, s, s]).concat(near.flatMap(s => favs[s.id]?.st === 'want' ? [s, s, s] : [s]));
  let i = 0, s;
  res.className = 'spin'; dlg.showModal();
  const tick = () => {
    s = bag[Math.floor(Math.random() * bag.length)];
    res.innerHTML = `<span class="cat">${esc(label)}</span><div class="nm">${esc(s.n)}</div><div class="meta">${fmt(s.m)}</div>`;
    if (++i < 14) setTimeout(tick, 40 + i * 12);
    else {
      res.className = '';
      res.innerHTML += `<div class="meta">${s.d ? '⭐ 網友推薦：' + esc(s.d) : esc(s.a || '')}</div>
        <div class="row"><button id="again">再抽一次</button><a href="${navUrl(s)}" target="_blank" rel="noopener">🧭 出發</a></div>
        <div class="row" style="margin-top:8px"><button id="detail">看店家</button></div>`;
      $('again').onclick = drawOne;
      $('detail').onclick = () => { dlg.close(); openShop(s.id); };
    }
  };
  tick();
}

// 事件
document.addEventListener('click', e => {
  const h = e.target.closest('[data-heart]');
  if (h) {
    e.stopPropagation();
    const s = shown.get(h.dataset.heart) || favs[h.dataset.heart]?.s;
    if (s) { setFav(s, {st:favs[s.id]?.st ? '' : 'want'}); refresh(); }
    return;
  }
  const it = e.target.closest('.item[data-id]');
  if (it) openShop(it.dataset.id);
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  view = b.dataset.v;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + view));
  if (view === 'map') drawMap();
  if (view === 'fav') renderFav();
});
let qt;
$('q').oninput = e => { clearTimeout(qt); $('qx').hidden = !e.target.value; qt = setTimeout(() => { query = e.target.value.trim(); render(); }, 200); };
$('qx').onclick = () => { $('q').value = ''; $('qx').hidden = true; query = ''; render(); };
$('openNow').onclick = () => { onlyOpen = !onlyOpen; $('openNow').classList.toggle('on', onlyOpen); render(); };
$('radius').onchange = render;
$('reload').onclick = () => start(false);
for (const d of [$('sheet'), $('draw-dlg')]) d.addEventListener('click', e => { if (e.target === d) d.close(); });
chips();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
start(false);
</script>
