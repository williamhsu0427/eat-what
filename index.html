<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e65100">
<title>等一下吃什麼</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f6f4f1;--card:#fff;--text:#22201d;--sub:#6b655e;--line:#e7e2db;--main:#e65100;--cn:#c62828;--it:#2e7d32;--th:#6a1b9a;--pick:#fff3e0;--pickt:#b34700}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#1f1c19;--text:#eeeae5;--sub:#a59d94;--line:#332e29;--main:#ff8a3d;--cn:#ef6a6a;--it:#5cbf63;--th:#c38be0;--pick:#3a2a1a;--pickt:#ffb27a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#e65100;color:#fff}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
.tabs{display:flex;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:8px 14px;font-size:15px;font-weight:600}
.tab small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.tab.on{color:#fff;border-color:transparent;background:var(--c)}
.tab.on small{color:rgba(255,255,255,.85)}
.bar{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;color:var(--sub)}
.bar span{flex:1;min-width:0}
.bar select{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 8px;font-size:13px}
#status.err{color:var(--cn)}
.draw{display:block;width:calc(100% - 24px);margin:2px 12px 0;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#e65100,#f9a825)}
#list{flex:1;overflow:auto;padding:0 12px calc(16px + env(safe-area-inset-bottom))}
.sec{font-size:13px;color:var(--sub);margin:16px 2px 0;font-weight:600}
.sec small{font-weight:400}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.item.pick{border-color:var(--main)}
.top{display:flex;align-items:baseline;gap:8px}
.top b{flex:1;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dist{font-size:13px;color:var(--sub);white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 7px;background:var(--pick);color:var(--pickt);margin-right:4px}
.meta{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
.meta a{color:var(--main)}
.btns{display:flex;gap:6px;margin-top:10px}
.btns a{flex:1;white-space:nowrap;text-align:center;text-decoration:none;font-size:14px;border-radius:10px;padding:9px 2px;border:1px solid var(--line);color:var(--text);background:var(--bg)}
.btns a.nav{background:var(--main);border-color:var(--main);color:#fff;font-weight:600;flex:1.3}
.empty{text-align:center;color:var(--sub);padding:28px 16px;line-height:1.7;font-size:14px}
.empty button{border:0;background:var(--main);color:#fff;border-radius:8px;padding:7px 12px;font-size:14px;margin-top:6px}
dialog{border:0;border-radius:16px;padding:18px;max-width:420px;width:calc(100% - 32px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#res .cat{display:inline-block;color:#fff;border-radius:8px;padding:2px 10px;font-size:14px;font-weight:600}
#res .nm{font-size:22px;font-weight:800;margin:10px 0 4px;line-height:1.3}
#res.spin .nm{opacity:.5}
#res .row{display:flex;gap:8px;margin-top:14px}
#res .row button,#res .row a{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px 6px;font-size:16px;font-weight:700}
#res .row button{background:var(--bg);color:var(--text)}
#res .row a{background:var(--main);color:#fff}
footer{font-size:11px;color:var(--sub);text-align:center;padding:14px 0 4px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>🍜 等一下吃什麼</h1>
  <button id="reload">重新定位</button>
</header>
<div class="tabs" id="tabs"></div>
<div class="bar">
  <span id="status">定位中…</span>
  <select id="radius">
    <option value="1000">1 公里</option>
    <option value="2000">2 公里</option>
    <option value="3000">3 公里</option>
    <option value="5000" selected>5 公里</option>
  </select>
</div>
<button class="draw" id="draw">🎲 幫我抽一家</button>
<div id="list"></div>

<dialog id="dlg"><div id="res"></div></dialog>

<script>
// 料理種類：c 是地圖上的料理標籤，n 是店名關鍵字，x 是要排除的店名
const CATS = [
  {k:'cn', name:'中式台菜', color:'#c62828', c:/chinese|taiwanese|cantonese|sichuan|hunan|shanghai|beijing|noodle|dumpling|congee|dim_sum|xiaolongbao|hong_kong|teochew|hakka|beef_noodle/,
   n:/麵|麪|飯|熱炒|快炒|小館|餃|包子|小籠|湯包|粥|川菜|川味|粵|港式|燒臘|台菜|便當|點心|酸菜魚|滷|羹|焿|小吃|食堂|豆漿|炒|飯館|魯肉|肉圓|鹽酥雞/,
   x:/拉麵|烏龍|日式|韓|丼|壽司|義|泰|越|印度|咖哩|漢堡|pasta|ramen|居酒屋|燒肉|定食|早午餐|brunch|麥當勞|肯德基|摩斯|subway|鍋/i},
  {k:'hp', name:'火鍋', color:'#d84315', c:/hot_?pot|shabu/, n:/火鍋|涮涮|鍋物|麻辣鍋|薑母鴨|羊肉爐|石頭火鍋|壽喜燒|嘀兜雞|豬肚雞|煲/},
  {k:'jp', name:'日式', color:'#1565c0', c:/japanese|ramen|sushi|udon|soba|tonkatsu|yakitori|izakaya|donburi/, n:/拉麵|壽司|丼|日式|日本料理|居酒屋|定食|烏龍|燒肉|串燒|炸豬排|咖哩|蕎麥/, x:/韓/},
  {k:'kr', name:'韓式', color:'#ad1457', c:/korean/, n:/韓|首爾|釜山|部隊鍋|拌飯|石鍋/},
  {k:'it', name:'義式', color:'#2e7d32', c:/italian|pizza|pasta/, n:/義大利|義式|意大利|pasta|pizza|披薩|比薩|trattoria|osteria|pizzeria/i},
  {k:'th', name:'泰式南洋', color:'#6a1b9a', c:/thai|vietnamese|indonesian|malaysian|burmese|singaporean|asian/, n:/泰式|泰國|泰菜|泰緬|thai|曼谷|打拋|月亮蝦餅|^泰|越南|河粉|南洋|印尼|緬甸|星馬|雲南|叻沙/i},
  {k:'us', name:'美式漢堡', color:'#5d4037', c:/american|burger|steak|fried_chicken|diner|brunch/, n:/漢堡|牛排|炸雞|美式|burger|早午餐|brunch|steak/i},
  {k:'veg', name:'素食', color:'#558b2f', c:/vegetarian|vegan/, n:/素食|蔬食|素|vegan/i},
];
const CAT = Object.fromEntries(CATS.map(c => [c.k, c]));

// 網友推薦名單：景平站一帶，整理自食記與美食平台（座標為約略位置，導航用店名＋地址）
const PICKS = [
  {k:['hp'], n:'蘇記嘀兜雞', a:'新北市中和區景平路154號', lat:24.9918, lon:121.5190, d:'豬肚雞火鍋，招牌白胡椒湯頭', src:'https://woment.com.tw/12432/mrt-y10-food/'},
  {k:['cn'], n:'麵麵軒', a:'新北市中和區景平路240巷2弄17號', lat:24.9936, lon:121.5158, d:'重慶小麵、酸辣粉、鮮蝦餛飩麵', src:'https://www.gomaji.com/blog/%E6%99%AF%E5%B9%B3%E6%8D%B7%E9%81%8B%E7%AB%99%E7%BE%8E%E9%A3%9F/'},
  {k:['hp'], n:'景平洞天 粵式煲湯獨享鍋', a:'新北市中和區景平路240巷2弄3號', lat:24.9934, lon:121.5157, d:'個人煲湯鍋＋自助吧，魚滿鍋', src:'https://mibaoma.tw/dongtianhotpot/'},
  {k:['cn'], n:'港都熱炒', a:'新北市中和區大勇街12號', lat:24.9932, lon:121.5168, d:'粵菜大廚熱炒，開到深夜，宵夜好去處', src:'https://eggie.tw/blog/post/228321956'},
  {k:['cn'], n:'永芳陳家祖傳美食', a:'新北市中和區大勇街25巷2號', lat:24.9936, lon:121.5163, d:'在地老字號小吃', src:'https://ifoodie.tw/explore/%E6%96%B0%E5%8C%97%E5%B8%82/list/%E6%99%AF%E5%B9%B3%E8%B7%AF%E7%BE%8E%E9%A3%9F'},
  {k:['jp'], n:'藏味拉麵', a:'新北市中和區景安路132巷1號', lat:24.9942, lon:121.5044, d:'濃厚豚骨叉燒拉麵', src:'https://www.gomaji.com/blog/%E6%99%AF%E5%B9%B3%E6%8D%B7%E9%81%8B%E7%AB%99%E7%BE%8E%E9%A3%9F/'},
  {k:['jp'], n:'醇串食代', a:'新北市中和區景平路311號', lat:24.9927, lon:121.5126, d:'懷舊復古串燒居酒屋，要先訂位', src:'https://tenjo.tw/chunchuan/'},
  {k:['jp'], n:'私藏不藏私', a:'新北市中和區景安路167巷6號', lat:24.9947, lon:121.5061, d:'日式咖哩輕食，唐揚菠菜乾咖哩', src:'https://www.gomaji.com/blog/%E6%99%AF%E5%B9%B3%E6%8D%B7%E9%81%8B%E7%AB%99%E7%BE%8E%E9%A3%9F/'},
  {k:['us'], n:'B.burger 嗶嗶漢堡', a:'新北市中和區景平路240巷2弄19號', lat:24.9936, lon:121.5159, d:'明太子蝦排蛋堡，乾燥花牆好拍', src:'https://www.gomaji.com/blog/%E6%99%AF%E5%B9%B3%E6%8D%B7%E9%81%8B%E7%AB%99%E7%BE%8E%E9%A3%9F/'},
  {k:['it'], n:'尼西義大利麵', a:'新北市中和區景平路240巷2弄13號', lat:24.9935, lon:121.5157, d:'百元手工醬料義大利麵，CP 值高', src:'https://mibaoma.tw/nissipasta_juliano2005/'},
  {k:['it'], n:'水牛哥義式坊', a:'新北市中和區景平路240巷1弄2號', lat:24.9930, lon:121.5155, d:'照燒章魚披薩、清炒蒜香海鮮麵', src:'https://www.gomaji.com/blog/%E6%99%AF%E5%B9%B3%E6%8D%B7%E9%81%8B%E7%AB%99%E7%BE%8E%E9%A3%9F/'},
  {k:['it'], n:'傑米義式小坊', a:'新北市中和區大勇街27巷2號', lat:24.9938, lon:121.5165, d:'墨魚起司海鮮義大利麵', src:'https://www.gomaji.com/blog/%E4%B8%AD%E5%92%8C%E7%BE%A9%E5%A4%A7%E5%88%A9%E9%BA%B5/'},
  {k:['it'], n:'木可義式廚房', a:'新北市中和區自立路13號', lat:24.9951, lon:121.5221, d:'清炒系列最受歡迎，100～200 元', src:'https://www.fonfood.com/store/285759'},
  {k:['th'], n:'泰可愛 SiamCute', a:'新北市中和區大勇街25巷15弄3號', lat:24.9940, lon:121.5152, d:'道地泰菜兼賣雜貨，泰式魚餅、咖哩海鮮', src:'https://ifoodie.tw/post/5f78618e8c906d7393617031'},
  {k:['th'], n:'泰香館泰式料理', a:'新北市中和區景平路274號', lat:24.9926, lon:121.5142, d:'小店大人潮，月亮蝦餅、椒麻雞排', src:'https://justamy9282.pixnet.net/blog/post/462623897'},
  {k:['th', 'veg'], n:'素速泰 SusuThai', a:'新北市中和區景平路298號', lat:24.9926, lon:121.5132, d:'純素泰式，椰汁紅咖哩飯', src:'https://lololo223344.pixnet.net/blog/post/346504113'},
  {k:['th'], n:'泰糯糯泰式料理', a:'新北市中和區安樂路41號', lat:24.9920, lon:121.5117, d:'青木瓜沙拉、羅望子炒蝦，白飯續到飽', src:'https://may128.com/thai-noir-cuisine/'},
  {k:['th'], n:'雲川泰緬小館', a:'新北市中和區景平路462號', lat:24.9930, lon:121.5065, d:'超厚月亮蝦餅、酸辣海鮮湯', src:'https://ifoodie.tw/post/5e96b07dd6895d7c5ebdcdab'},
];
const JINGPING = {lat:24.9920, lon:121.5159};
// 開放地圖（OpenStreetMap）資料，免金鑰；幾個資料站同時問，誰先回就用誰
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter'];

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let here = null, cat = store.get('cat') || 'cn', nearby = [], approx = false, loading = true, failed = false, runId = 0;
if (!CAT[cat]) cat = 'cn';

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dist(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const x = Math.sin((b.lat - a.lat) * r / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin((b.lon - a.lon) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function fmt(m) { return m < 1000 ? Math.round(m / 10) * 10 + ' 公尺' : (m / 1000).toFixed(1) + ' 公里'; }

// 一家店可以同時屬於好幾類（例如素食泰式）
function classify(t) {
  const c = (t.cuisine || '').toLowerCase(), n = t.name || '', ks = [];
  for (const C of CATS) {
    if (C.x && C.x.test(n)) continue;
    if (C.c.test(c) || (C.k === 'cn' ? !c && C.n.test(n) : C.n.test(n))) ks.push(C.k);
  }
  if (/yes|only/.test(t['diet:vegetarian'] || '') || /yes|only/.test(t['diet:vegan'] || '')) ks.includes('veg') || ks.push('veg');
  return ks;
}

async function overpass(q) {
  const ctls = OVERPASS.map(() => new AbortController());
  const tm = setTimeout(() => ctls.forEach(c => c.abort()), 25000);
  try {
    return await Promise.any(OVERPASS.map(async (u, i) => {
      const r = await fetch(u, {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal:ctls[i].signal});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      ctls.forEach((c, j) => j !== i && c.abort());
      return d;
    }));
  } finally { clearTimeout(tm); }
}

// 用方框查比用圓形查快很多，距離再自己算
async function fetchArea(p, R) {
  const dLat = R / 111320, dLon = R / (111320 * Math.cos(p.lat * Math.PI / 180));
  const bb = [p.lat - dLat, p.lon - dLon, p.lat + dLat, p.lon + dLon].map(x => x.toFixed(5)).join(',');
  const d = await overpass(`[out:json][timeout:20];nwr["amenity"~"^(restaurant|fast_food|food_court)$"]["name"](${bb});out center tags qt;`);
  const v = [];
  for (const e of d.elements) {
    const t = e.tags || {}, k = classify(t);
    const lat = e.lat ?? e.center?.lat, lon = e.lon ?? e.center?.lon;
    if (!k.length || lat == null) continue;
    const addr = [t['addr:street'], t['addr:housenumber'] && t['addr:housenumber'] + '號'].filter(Boolean).join('');
    v.push({k, n:t.name, lat, lon, a:addr, h:t.opening_hours || ''});
  }
  return v;
}

// 快取：同一帶（約 1 公里格）一週內直接秀，超過一天背景再更新
function cacheKey(p) { return 'near2:' + p.lat.toFixed(2) + ',' + p.lon.toFixed(2); }
async function loadNearby(id) {
  const key = cacheKey(here), c = store.get(key);
  if (c && Date.now() - c.t < 7 * 864e5) {
    nearby = c.v; loading = false; render();
    if (Date.now() - c.t < 864e5) return;
  }
  const p = here;
  if (!c) {
    // 先抓 1.5 公里，馬上有店可看；再補滿 5 公里
    try {
      const v = await fetchArea(p, 1500);
      if (id !== runId) return;
      nearby = v; loading = false; render();
    } catch (e) {}
  }
  try {
    const v = await fetchArea(p, 5000);
    if (id !== runId) return;
    nearby = v; loading = false; failed = false;
    for (const x of Object.keys(localStorage)) if (x.startsWith('near')) try { localStorage.removeItem(x); } catch (e) {}
    store.set(key, {t:Date.now(), v});
  } catch (e) {
    if (id !== runId) return;
    if (!nearby.length) failed = true;
    loading = false;
  }
  render();
}

function navUrl(s) {
  const dest = s.src ? s.n + ' ' + s.a : s.lat + ',' + s.lon;
  return 'https://www.google.com/maps/dir/?api=1&travelmode=' + (s.m > 1500 ? 'driving' : 'walking') + '&destination=' + encodeURIComponent(dest);
}
function threadsUrl(s) { return 'https://www.threads.net/search?q=' + encodeURIComponent(s.n + ' 中和') + '&serp_type=default'; }
function igUrl(s) { return 'https://www.instagram.com/explore/search/keyword/?q=' + encodeURIComponent(s.n); }

function card(s, pick) {
  return `<div class="item${pick ? ' pick' : ''}">
    <div class="top"><b>${esc(s.n)}</b><span class="dist">${fmt(s.m)}</span></div>
    <div class="meta">${pick ? '<span class="badge">網友推薦</span>' + esc(s.d) + '　<a href="' + s.src + '" target="_blank" rel="noopener">看食記</a><br>' : ''}${esc(s.a || '')}${s.h ? '<br>營業：' + esc(s.h) : ''}</div>
    <div class="btns">
      <a class="nav" href="${navUrl(s)}" target="_blank" rel="noopener">🧭 導航</a>
      <a href="${threadsUrl(s)}" target="_blank" rel="noopener">Threads</a>
      <a href="${igUrl(s)}" target="_blank" rel="noopener">IG</a>
    </div></div>`;
}

function pool(k) {
  const R = +$('radius').value;
  const withD = arr => arr.filter(s => s.k.includes(k)).map(s => ({...s, m:dist(here, s)})).filter(s => s.m <= R).sort((a, b) => a.m - b.m);
  const picks = withD(PICKS);
  const names = new Set(picks.map(p => p.n.slice(0, 3)));
  const near = withD(nearby).filter(s => !names.has(s.n.slice(0, 3)));
  return {picks, near};
}

function tabs() {
  $('tabs').innerHTML = CATS.map(C => `<button class="tab${C.k === cat ? ' on' : ''}" data-k="${C.k}" style="--c:${C.color}">${C.name}<small id="n-${C.k}">–</small></button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    $('tabs').querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    cat = b.dataset.k; store.set('cat', cat); render(); $('list').scrollTop = 0;
  });
  $('tabs').querySelector('.on').scrollIntoView({inline:'center', block:'nearest'});
}

function render() {
  if (!here) return;
  for (const C of CATS) {
    const p = pool(C.k);
    $('n-' + C.k).textContent = loading && !nearby.length ? '找店中…' : (p.picks.length + p.near.length) + ' 家';
  }
  const {picks, near} = pool(cat), name = CAT[cat].name;
  let h = '';
  if (picks.length) h += `<div class="sec">⭐ 網友推薦 <small>景平站一帶</small></div>` + picks.map(s => card(s, true)).join('');
  h += `<div class="sec">📍 附近${name}店家 <small>由近到遠${loading && nearby.length ? '，還在補更遠的店…' : ''}</small></div>`;
  if (loading && !nearby.length) h += '<div class="empty">正在找附近店家…</div>';
  else if (failed) h += '<div class="empty">附近店家暫時抓不到（地圖資料站忙線）。<br><button onclick="start(true)">再試一次</button></div>';
  else if (!near.length) h += `<div class="empty">這個範圍內沒找到${name}店家，試試別的種類或把範圍調大。</div>`;
  else h += near.slice(0, 80).map(s => card(s, false)).join('');
  h += '<footer>附近店家來自 OpenStreetMap 開放地圖，免金鑰<br>網友推薦整理自食記與美食平台，出發前建議先確認營業時間</footer>';
  $('list').innerHTML = h;
}

// 不要求 GPS 精準定位，用網路定位幾乎是秒回，5 公里範圍夠用了
function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude, lon:p.coords.longitude}), () => res(null), {enableHighAccuracy:false, timeout:8000, maximumAge:300000});
  });
}

async function start(retry) {
  const id = ++runId;
  $('status').classList.remove('err');
  if (!retry || !here) {
    // 先用上次的位置把清單秀出來，定位好了再換
    const last = store.get('lastPos');
    if (last && !here) { here = last; approx = false; $('status').textContent = '定位中，先用上次的位置…'; render(); }
    else $('status').textContent = '定位中…';
    const p = await getPos();
    if (id !== runId) return;
    approx = !p;
    if (p) store.set('lastPos', p);
    here = p || last || JINGPING;
  }
  $('status').textContent = approx ? '抓不到定位，先用' + (store.get('lastPos') ? '上次的位置' : '景平站') : '已用你目前的位置';
  $('status').classList.toggle('err', approx);
  nearby = []; loading = true; failed = false; render();
  await loadNearby(id);
}

function drawOne() {
  const {picks, near} = pool(cat);
  const res = $('res'), C = CAT[cat];
  if (!picks.length && !near.length) { res.innerHTML = '<p>這個範圍內還沒有店家可以抽。</p><div class="row"><button onclick="dlg.close()">好</button></div>'; dlg.showModal(); return; }
  // 網友推薦的店多放幾次，比較容易抽到
  const bag = picks.flatMap(s => [s, s, s]).concat(near);
  let i = 0, s;
  res.className = 'spin'; dlg.showModal();
  const tick = () => {
    s = bag[Math.floor(Math.random() * bag.length)];
    res.innerHTML = `<span class="cat" style="background:${C.color}">${C.name}</span><div class="nm">${esc(s.n)}</div><div class="meta">${fmt(s.m)}</div>`;
    if (++i < 14) setTimeout(tick, 40 + i * 12);
    else {
      res.className = '';
      res.innerHTML += `<div class="meta">${s.d ? '⭐ 網友推薦：' + esc(s.d) : esc(s.a || '')}</div>
        <div class="row"><button onclick="drawOne()">再抽一次</button><a href="${navUrl(s)}" target="_blank" rel="noopener">🧭 出發</a></div>`;
    }
  };
  tick();
}

tabs();
$('radius').onchange = render;
$('reload').onclick = () => start(false);
$('draw').onclick = drawOne;
$('dlg').addEventListener('click', e => { if (e.target.id === 'dlg') dlg.close(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
start(false);
</script>
</body>
</html>
